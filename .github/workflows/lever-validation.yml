# Project Lever — per-task-repo workflow shim
#
# Copy this into every lever-* task repo at:
#   .github/workflows/lever-validation.yml
# (and bake it into the task scaffold so new tasks get it automatically).
#
# It is intentionally minimal — all logic lives in the reusable workflow at
# handshake-project-lever/lever-orchestration/.github/workflows/lever-validation.yml
#
# Runs on a PR from the `golden-solve` branch (the authoring branch, same as
# Valve), or manually from the Actions tab. Unlike Valve's shim there is no
# `secrets: inherit`: the Lever reusable workflow needs no secrets (see the
# note in lever-validation.yml about the GitHub Free plan).

name: Project Lever Auto QC

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write  # lets the reusable workflow comment the failing gates on the PR

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.base_ref == github.event.repository.default_branch && github.head_ref == 'golden-solve')
    uses: handshake-project-lever/lever-orchestration/.github/workflows/lever-validation.yml@main
